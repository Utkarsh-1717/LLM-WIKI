name: "Stage 1 — Pairs Trading Monthly Re-Roll"

on:
  schedule:
    # 3:00 AM IST every Sunday = 21:30 UTC Saturday
    - cron: "30 21 * * 6"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI for testing

jobs:
  run_stage1:
    name: "Push Stage 1 Notebook to Kaggle"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Kaggle CLI"
        run: pip install kaggle --quiet

      - name: "Configure Kaggle Credentials"
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"utkarshpatelthefirst","key":"fbef16329099428205f671dd5de8337b"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: "Generate Kaggle Notebook"
        run: |
          cd Soul/pairs-trading/Stage-1/Code
          python3 pair_trading_stage1.py

      - name: "Push Notebook to Kaggle"
        run: |
          kaggle kernels push -p Soul/pairs-trading/Stage-1/Code/kaggle_staging/stage1_monthly
          echo "✅ Stage 1 kernel pushed to Kaggle at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: "Notify Push Complete"
        run: |
          echo "Stage 1 kernel pushed successfully. Kaggle will now execute the notebook."
          echo "Monitor at: https://www.kaggle.com/code/utkarshpatelthefirst/pairs-trading-stage1-monthly"
